# Application Configuration
spring.application.name=Online Pharmacy Management System
server.port=8081

# H2 Database Configuration (In-Memory for Testing)
spring.datasource.url=jdbc:h2:mem:pharmacy_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Upload Directory
app.upload.dir=uploads/prescriptions

# Logging Configuration
logging.level.com.pharmacy=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Razorpay Payment Gateway Configuration (Test Mode)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TKt8QEGMnkXNFY}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:Bol125sl3onZVyTI0C44CGnC}
razorpay.currency=INR
razorpay.company.name=Online Pharmacy Management System

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:karthikkarthikeyanvm@gmail.com}
spring.mail.password=${MAIL_PASSWORD:rqka fkjv sgwv qmwh}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email Settings
app.mail.from=${MAIL_FROM:noreply@pharmacymanagement.com}
app.mail.company=Online Pharmacy Management System
app.mail.support=support@pharmacymanagement.com

# Application Base URL (for password reset links)
app.base-url=${BASE_URL:http://localhost:8081}
