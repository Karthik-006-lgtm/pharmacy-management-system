<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <h2 class="mb-4">Order History</h2>
        
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div th:if="${#lists.isEmpty(orders)}" class="text-center py-5">
            <i class="bi bi-bag-x" style="font-size: 5rem; color: #ccc;"></i>
            <h3 class="mt-3">No orders yet</h3>
            <p>Start shopping to see your orders here</p>
            <a th:href="@{/medicines}" class="btn btn-primary">Browse Medicines</a>
        </div>
        
        <div th:if="${!#lists.isEmpty(orders)}">
            <div class="card mb-3" th:each="order : ${orders}">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-3">
                            <h6 class="mb-1">Order #<span th:text="${order.orderNumber}">ORD-123</span></h6>
                            <small class="text-muted" th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy HH:mm')}">
                                Date
                            </small>
                        </div>
                        <div class="col-md-2">
                            <strong>₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span></strong>
                        </div>
                        <div class="col-md-2">
                            <span class="badge order-status"
                                  th:classappend="${order.status.name() == 'DELIVERED' ? 'bg-success' : 
                                                   (order.status.name() == 'CANCELLED' ? 'bg-danger' : 
                                                   (order.status.name() == 'SHIPPED' ? 'bg-info' : 'bg-warning text-dark'))}"
                                  th:text="${#strings.replace(order.status.name(), '_', ' ')}">
                                Status
                            </span>
                        </div>
                        <div class="col-md-2">
                            <small th:text="${order.orderItems.size()} + ' items'">0 items</small>
                        </div>
                        <div class="col-md-3 text-end">
                            <a th:href="@{/orders/track(orderNumber=${order.orderNumber})}" 
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-eye"></i> View Details
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
