<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Manage Medicines</h2>
            <a th:href="@{/admin/medicines/add}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Add Medicine
            </a>
        </div>
        
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Brand</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Expiry Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="medicine : ${medicines}">
                                <td th:text="${medicine.id}">1</td>
                                <td th:text="${medicine.name}">Medicine</td>
                                <td th:text="${medicine.brand}">Brand</td>
                                <td th:text="${medicine.category.name}">Category</td>
                                <td>₹<span th:text="${#numbers.formatDecimal(medicine.price, 1, 2)}">0.00</span></td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${medicine.stock > 10 ? 'bg-success' : 'bg-danger'}"
                                          th:text="${medicine.stock}">0</span>
                                </td>
                                <td th:text="${#temporals.format(medicine.expiryDate, 'dd MMM yyyy')}">Date</td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${medicine.active ? 'bg-success' : 'bg-secondary'}"
                                          th:text="${medicine.active ? 'Active' : 'Inactive'}">
                                        Active
                                    </span>
                                </td>
                                <td class="table-actions">
                                    <a th:href="@{/admin/medicines/edit/{id}(id=${medicine.id})}" 
                                       class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/admin/medicines/delete/{id}(id=${medicine.id})}" 
                                          method="post" style="display: inline;">
                                        <button type="submit" class="btn btn-sm btn-outline-danger delete-confirm">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="mt-3">
            <a th:href="@{/admin}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
