<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <h2 class="mb-4" th:text="${medicine.id != null ? 'Edit Medicine' : 'Add Medicine'}">Add Medicine</h2>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <form th:action="${medicine.id != null ? '/admin/medicines/edit/' + medicine.id : '/admin/medicines/add'}" 
                              th:object="${medicine}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label">Medicine Name</label>
                                <input type="text" th:field="*{name}" class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{name}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Brand</label>
                                <input type="text" th:field="*{brand}" class="form-control"
                                       th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{brand}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <select th:field="*{categoryId}" class="form-select"
                                        th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                                    <option value="">Select Category</option>
                                    <option th:each="cat : ${categories}" 
                                            th:value="${cat.id}" 
                                            th:text="${cat.name}">Category</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Manufacturer</label>
                                <input type="text" th:field="*{manufacturer}" class="form-control">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Price (₹)</label>
                                    <input type="number" step="0.01" th:field="*{price}" class="form-control"
                                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{price}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Stock</label>
                                    <input type="number" th:field="*{stock}" class="form-control"
                                           th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{stock}"></div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Manufacture Date</label>
                                    <input type="date" th:field="*{manufactureDate}" class="form-control"
                                           th:classappend="${#fields.hasErrors('manufactureDate')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{manufactureDate}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Expiry Date</label>
                                    <input type="date" th:field="*{expiryDate}" class="form-control"
                                           th:classappend="${#fields.hasErrors('expiryDate')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{expiryDate}"></div>
                                </div>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" th:field="*{prescriptionRequired}" class="form-check-input" id="prescriptionCheck">
                                <label class="form-check-label" for="prescriptionCheck">
                                    Requires Prescription
                                </label>
                            </div>
                            
                            <div class="mb-3 form-check" th:if="${medicine.id != null}">
                                <input type="checkbox" th:field="*{active}" class="form-check-input" id="activeCheck">
                                <label class="form-check-label" for="activeCheck">
                                    Active
                                </label>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Save Medicine
                                </button>
                                <a th:href="@{/admin/medicines}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
