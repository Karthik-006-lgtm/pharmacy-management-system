<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <h2 class="mb-4">Customer Details</h2>
        
        <div class="card">
            <div class="card-body">
                <h4 class="card-title mb-4">Personal Information</h4>
                <table class="table table-borderless">
                    <tr>
                        <th width="30%">Full Name:</th>
                        <td th:text="${customer.fullName}">Name</td>
                    </tr>
                    <tr>
                        <th>Email:</th>
                        <td th:text="${customer.email}">Email</td>
                    </tr>
                    <tr>
                        <th>Phone:</th>
                        <td th:text="${customer.phone}">Phone</td>
                    </tr>
                    <tr>
                        <th>Address:</th>
                        <td th:text="${customer.address}">Address</td>
                    </tr>
                    <tr>
                        <th>City:</th>
                        <td th:text="${customer.city}">City</td>
                    </tr>
                    <tr>
                        <th>State:</th>
                        <td th:text="${customer.state}">State</td>
                    </tr>
                    <tr>
                        <th>Pincode:</th>
                        <td th:text="${customer.pincode}">Pincode</td>
                    </tr>
                    <tr>
                        <th>Registered On:</th>
                        <td th:text="${#temporals.format(customer.createdAt, 'dd MMMM yyyy')}">Date</td>
                    </tr>
                    <tr>
                        <th>Status:</th>
                        <td>
                            <span class="badge" 
                                  th:classappend="${customer.enabled ? 'bg-success' : 'bg-danger'}"
                                  th:text="${customer.enabled ? 'Active' : 'Inactive'}">
                                Active
                            </span>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
        
        <div class="mt-3">
            <a th:href="@{/admin/customers}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to Customers
            </a>
        </div>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
