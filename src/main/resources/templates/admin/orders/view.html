<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <h2 class="mb-4">Order Details</h2>
        
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <h4 class="mb-1">Order #<span th:text="${order.orderNumber}">ORD-123</span></h4>
                                <small class="text-muted">
                                    Placed on <span th:text="${#temporals.format(order.orderDate, 'dd MMMM yyyy, HH:mm')}">Date</span>
                                </small>
                            </div>
                            <span class="badge order-status fs-6"
                                  th:classappend="${order.status.name() == 'DELIVERED' ? 'bg-success' : 
                                                   (order.status.name() == 'CANCELLED' ? 'bg-danger' : 
                                                   (order.status.name() == 'SHIPPED' ? 'bg-info' : 'bg-warning text-dark'))}"
                                  th:text="${#strings.replace(order.status.name(), '_', ' ')}">
                                Status
                            </span>
                        </div>
                        
                        <hr>
                        
                        <h5 class="mb-3">Customer Information</h5>
                        <p class="mb-1"><strong th:text="${order.user.fullName}">Name</strong></p>
                        <p class="mb-1">Email: <span th:text="${order.user.email}">email</span></p>
                        <p class="mb-1">Phone: <span th:text="${order.contactPhone}">phone</span></p>
                        
                        <hr>
                        
                        <h5 class="mb-3">Order Items</h5>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Medicine</th>
                                        <th>Price</th>
                                        <th>Quantity</th>
                                        <th>Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${order.orderItems}">
                                        <td>
                                            <strong th:text="${item.medicine.name}">Medicine</strong><br>
                                            <small class="text-muted" th:text="${item.medicine.brand}">Brand</small>
                                        </td>
                                        <td>₹<span th:text="${#numbers.formatDecimal(item.price, 1, 2)}">0.00</span></td>
                                        <td th:text="${item.quantity}">1</td>
                                        <td>₹<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</span></td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="3" class="text-end"><strong>Total Amount:</strong></td>
                                        <td><strong class="text-primary">
                                            ₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span>
                                        </strong></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Shipping Address</h5>
                        <p class="mb-1" th:text="${order.shippingAddress}">Address</p>
                        <p th:text="${order.shippingCity + ', ' + order.shippingState}">City, State</p>
                        <p th:text="${order.shippingPincode}">Pincode</p>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Update Order Status</h5>
                        <form th:action="@{/admin/orders/update-status}" method="post">
                            <input type="hidden" name="orderId" th:value="${order.id}">
                            <select name="status" class="form-select mb-3">
                                <option th:each="stat : ${T(com.pharmacy.entity.Order.OrderStatus).values()}"
                                        th:value="${stat}"
                                        th:text="${#strings.replace(stat.name(), '_', ' ')}"
                                        th:selected="${stat == order.status}">
                                    Status
                                </option>
                            </select>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-check-circle"></i> Update Status
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-3">
            <a th:href="@{/admin/orders}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to Orders
            </a>
        </div>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
