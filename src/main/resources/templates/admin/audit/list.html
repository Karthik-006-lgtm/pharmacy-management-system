<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <h2 class="mb-4">Audit Logs</h2>
        
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Action</th>
                                <th>Entity</th>
                                <th>Details</th>
                                <th>Performed By</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="log : ${logs}">
                                <td th:text="${#temporals.format(log.timestamp, 'dd MMM yyyy HH:mm:ss')}">Date</td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${log.action.contains('DELETE') ? 'bg-danger' : 
                                                           (log.action.contains('ADDED') ? 'bg-success' : 'bg-info')}"
                                          th:text="${log.action}">
                                        Action
                                    </span>
                                </td>
                                <td th:text="${log.entityType}">Entity</td>
                                <td th:text="${log.details}">Details</td>
                                <td th:text="${log.performedBy.fullName}">User</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="mt-3">
            <a th:href="@{/admin}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
