<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <h2 class="mb-4">Manage Prescriptions</h2>
        
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div th:if="${#lists.isEmpty(prescriptions)}" class="text-center py-5">
            <i class="bi bi-file-medical" style="font-size: 5rem; color: #ccc;"></i>
            <h3 class="mt-3">No pending prescriptions</h3>
            <p>All prescriptions have been verified</p>
            <a th:href="@{/admin}" class="btn btn-primary">Back to Dashboard</a>
        </div>
        
        <div class="card" th:if="${!#lists.isEmpty(prescriptions)}">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Order #</th>
                                <th>Customer</th>
                                <th>Uploaded At</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="prescription : ${prescriptions}">
                                <td th:text="${prescription.id}">1</td>
                                <td th:text="${prescription.order.orderNumber}">ORD-123</td>
                                <td th:text="${prescription.user.fullName}">Customer</td>
                                <td th:text="${#temporals.format(prescription.uploadedAt, 'dd MMM yyyy HH:mm')}">Date</td>
                                <td>
                                    <span class="badge bg-warning text-dark" 
                                          th:text="${prescription.status.name()}">
                                        Status
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/prescriptions/view/{id}(id=${prescription.id})}" 
                                       class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye"></i> View
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="mt-3">
            <a th:href="@{/admin}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
