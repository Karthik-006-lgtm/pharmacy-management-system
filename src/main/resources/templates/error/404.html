<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5 text-center">
        <i class="bi bi-exclamation-circle" style="font-size: 8rem; color: #ef4444;"></i>
        <h1 class="mt-4">404 - Page Not Found</h1>
        <p class="lead" th:text="${error ?: 'The page you are looking for does not exist.'}">
            The page you are looking for does not exist.
        </p>
        <a th:href="@{/home}" class="btn btn-primary">Go to Home</a>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
