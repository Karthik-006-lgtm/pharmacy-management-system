<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <h2 class="mb-4">My Profile</h2>
        
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h4 class="card-title mb-0">Personal Information</h4>
                            <a th:href="@{/profile/edit}" class="btn btn-primary">
                                <i class="bi bi-pencil"></i> Edit Profile
                            </a>
                        </div>
                        
                        <table class="table table-borderless">
                            <tr>
                                <th width="30%">Full Name:</th>
                                <td th:text="${user.fullName}">Name</td>
                            </tr>
                            <tr>
                                <th>Email:</th>
                                <td th:text="${user.email}">Email</td>
                            </tr>
                            <tr>
                                <th>Phone:</th>
                                <td th:text="${user.phone}">Phone</td>
                            </tr>
                            <tr>
                                <th>Address:</th>
                                <td th:text="${user.address}">Address</td>
                            </tr>
                            <tr>
                                <th>City:</th>
                                <td th:text="${user.city}">City</td>
                            </tr>
                            <tr>
                                <th>State:</th>
                                <td th:text="${user.state}">State</td>
                            </tr>
                            <tr>
                                <th>Pincode:</th>
                                <td th:text="${user.pincode}">Pincode</td>
                            </tr>
                            <tr>
                                <th>Member Since:</th>
                                <td th:text="${#temporals.format(user.createdAt, 'dd MMMM yyyy')}">Date</td>
                            </tr>
                        </table>
                    </div>
                </div>
                
                <!-- My Invoices Section -->
                <div class="card mt-4">
                    <div class="card-body">
                        <h4 class="card-title mb-4"><i class="bi bi-receipt"></i> My Invoices</h4>
                        
                        <div th:if="${invoices.isEmpty()}" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-1"></i>
                            <p class="mt-2">No invoices yet</p>
                        </div>
                        
                        <div th:if="${!invoices.isEmpty()}" class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Invoice #</th>
                                        <th>Order #</th>
                                        <th>Date</th>
                                        <th>Amount</th>
                                        <th>Payment Method</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="invoice : ${invoices}">
                                        <td th:text="${invoice.invoiceNumber}">INV001</td>
                                        <td th:text="${invoice.order.orderNumber}">ORD001</td>
                                        <td th:text="${#temporals.format(invoice.createdAt, 'dd MMM yyyy')}">Date</td>
                                        <td>₹<span th:text="${#numbers.formatDecimal(invoice.totalAmount, 1, 2)}">0.00</span></td>
                                        <td>
                                            <span class="badge bg-info" th:text="${invoice.paymentMethod}">Payment</span>
                                        </td>
                                        <td>
                                            <a th:href="@{/invoice/download/{orderId}(orderId=${invoice.order.id})}" 
                                               class="btn btn-sm btn-primary">
                                                <i class="bi bi-download"></i> Download
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
