<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Create Account</h2>
                        
                        <form th:action="@{/register}" th:object="${user}" method="post">
                            <!-- Account Type Selection -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">Select Account Type</label>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <input type="radio" class="btn-check" name="accountType" id="customer" 
                                               th:field="*{accountType}" value="CUSTOMER" checked>
                                        <label class="btn btn-outline-primary w-100 py-3 d-flex flex-column align-items-center" for="customer">
                                            <i class="bi bi-person-circle fs-1 mb-2"></i>
                                            <span class="fw-bold">Customer</span>
                                            <small class="text-muted">Shop for medicines</small>
                                        </label>
                                    </div>
                                    <div class="col-md-6">
                                        <input type="radio" class="btn-check" name="accountType" id="pharmacist" 
                                               th:field="*{accountType}" value="PHARMACIST">
                                        <label class="btn btn-outline-primary w-100 py-3 d-flex flex-column align-items-center" for="pharmacist">
                                            <i class="bi bi-clipboard2-pulse fs-1 mb-2"></i>
                                            <span class="fw-bold">Pharmacist</span>
                                            <small class="text-muted">Professional account</small>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            
                            <hr class="my-4">
                            
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" th:field="*{fullName}" class="form-control" 
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{fullName}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" th:field="*{password}" class="form-control"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" th:field="*{phone}" class="form-control"
                                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{phone}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <textarea th:field="*{address}" class="form-control" rows="2"
                                          th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"></textarea>
                                <div class="invalid-feedback" th:errors="*{address}"></div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">City</label>
                                    <input type="text" th:field="*{city}" class="form-control"
                                           th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{city}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">State</label>
                                    <input type="text" th:field="*{state}" class="form-control"
                                           th:classappend="${#fields.hasErrors('state')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{state}"></div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Pincode</label>
                                <input type="text" th:field="*{pincode}" class="form-control"
                                       th:classappend="${#fields.hasErrors('pincode')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{pincode}"></div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Register</button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
