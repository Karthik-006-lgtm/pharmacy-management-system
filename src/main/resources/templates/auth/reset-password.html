<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock-fill text-success" style="font-size: 3rem;"></i>
                            <h2 class="mt-3">Reset Password</h2>
                            <p class="text-muted">Enter your new password below</p>
                        </div>
                        
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <div class="alert alert-info" role="alert">
                            <i class="bi bi-info-circle me-2"></i>
                            <strong>Account:</strong> <span th:text="${email}"></span>
                        </div>
                        
                        <form th:action="@{/reset-password}" method="post" id="resetPasswordForm">
                            <input type="hidden" name="token" th:value="${token}">
                            
                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" id="password" 
                                           class="form-control" placeholder="Enter new password" 
                                           required minlength="8">
                                    <button class="btn btn-outline-secondary" type="button" 
                                            onclick="togglePassword('password')">
                                        <i class="bi bi-eye" id="password-icon"></i>
                                    </button>
                                </div>
                                <div id="passwordHelp" class="form-text">
                                    <small>
                                        Password must contain:
                                        <ul class="mb-0 mt-1">
                                            <li id="length">At least 8 characters</li>
                                            <li id="uppercase">One uppercase letter</li>
                                            <li id="lowercase">One lowercase letter</li>
                                            <li id="number">One number</li>
                                            <li id="special">One special character (!@#$%^&*)</li>
                                        </ul>
                                    </small>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" name="confirmPassword" id="confirmPassword" 
                                           class="form-control" placeholder="Confirm new password" 
                                           required minlength="8">
                                    <button class="btn btn-outline-secondary" type="button" 
                                            onclick="togglePassword('confirmPassword')">
                                        <i class="bi bi-eye" id="confirmPassword-icon"></i>
                                    </button>
                                </div>
                                <div id="matchHelp" class="form-text"></div>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 mb-3" id="submitBtn">
                                <i class="bi bi-check-circle-fill me-2"></i>Reset Password
                            </button>
                            
                            <div class="text-center">
                                <a th:href="@{/login}" class="text-decoration-none">
                                    <i class="bi bi-arrow-left me-1"></i>Back to Login
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
    
    <script>
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(fieldId + '-icon');
            
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
        
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const matchHelp = document.getElementById('matchHelp');
        const submitBtn = document.getElementById('submitBtn');
        
        passwordInput.addEventListener('input', validatePassword);
        confirmPasswordInput.addEventListener('input', checkPasswordMatch);
        
        function validatePassword() {
            const password = passwordInput.value;
            
            const hasLength = password.length >= 8;
            const hasUppercase = /[A-Z]/.test(password);
            const hasLowercase = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecial = /[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(password);
            
            updateRequirement('length', hasLength);
            updateRequirement('uppercase', hasUppercase);
            updateRequirement('lowercase', hasLowercase);
            updateRequirement('number', hasNumber);
            updateRequirement('special', hasSpecial);
            
            checkPasswordMatch();
        }
        
        function updateRequirement(id, valid) {
            const element = document.getElementById(id);
            if (valid) {
                element.style.color = 'green';
                element.innerHTML = '<i class="bi bi-check-circle-fill"></i> ' + element.textContent;
            } else {
                element.style.color = 'red';
                element.innerHTML = element.textContent.replace(/<i[^>]*><\/i>\s*/g, '');
            }
        }
        
        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            if (confirmPassword.length === 0) {
                matchHelp.textContent = '';
                matchHelp.className = 'form-text';
                return;
            }
            
            if (password === confirmPassword) {
                matchHelp.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i> Passwords match';
                matchHelp.className = 'form-text text-success';
                submitBtn.disabled = false;
            } else {
                matchHelp.innerHTML = '<i class="bi bi-x-circle-fill text-danger"></i> Passwords do not match';
                matchHelp.className = 'form-text text-danger';
                submitBtn.disabled = true;
            }
        }
    </script>
</body>
</html>
