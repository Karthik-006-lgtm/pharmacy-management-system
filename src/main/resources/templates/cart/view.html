<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <h2 class="mb-4">Shopping Cart</h2>
        
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div th:if="${#lists.isEmpty(cartItems)}" class="text-center py-5">
            <i class="bi bi-cart-x" style="font-size: 5rem; color: #ccc;"></i>
            <h3 class="mt-3">Your cart is empty</h3>
            <p>Add some medicines to get started</p>
            <a th:href="@{/medicines}" class="btn btn-primary">Browse Medicines</a>
        </div>
        
        <div th:if="${!#lists.isEmpty(cartItems)}">
            <div class="row">
                <div class="col-md-8">
                    <div class="card mb-3" th:each="item : ${cartItems}">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col-md-6">
                                    <h5 th:text="${item.medicine.name}">Medicine Name</h5>
                                    <p class="text-muted mb-1" th:text="${item.medicine.brand}">Brand</p>
                                    <p class="text-primary mb-0">₹<span th:text="${#numbers.formatDecimal(item.price, 1, 2)}">0.00</span> per unit</p>
                                </div>
                                <div class="col-md-3">
                                    <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center">
                                        <input type="hidden" name="cartId" th:value="${item.id}">
                                        <input type="number" name="quantity" th:value="${item.quantity}" 
                                               class="form-control cart-quantity me-2" min="1" 
                                               th:max="${item.medicine.stock}">
                                        <button type="submit" class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-arrow-clockwise"></i>
                                        </button>
                                    </form>
                                </div>
                                <div class="col-md-3 text-end">
                                    <h5 class="text-primary mb-3">
                                        ₹<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</span>
                                    </h5>
                                    <form th:action="@{/cart/remove}" method="post" style="display: inline;">
                                        <input type="hidden" name="cartId" th:value="${item.id}">
                                        <button type="submit" class="btn btn-sm btn-danger delete-confirm">
                                            <i class="bi bi-trash"></i> Remove
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title mb-4">Order Summary</h4>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Items:</span>
                                <span th:text="${cartCount}">0</span>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <span>Subtotal:</span>
                                <span>₹<span th:text="${#numbers.formatDecimal(cartTotal, 1, 2)}">0.00</span></span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-4">
                                <strong>Total:</strong>
                                <strong class="text-primary">₹<span th:text="${#numbers.formatDecimal(cartTotal, 1, 2)}">0.00</span></strong>
                            </div>
                            <a th:href="@{/orders/checkout}" class="btn btn-primary w-100 mb-2">
                                <i class="bi bi-credit-card"></i> Proceed to Checkout
                            </a>
                            <a th:href="@{/medicines}" class="btn btn-outline-primary w-100">
                                <i class="bi bi-arrow-left"></i> Continue Shopping
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
