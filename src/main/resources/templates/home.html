<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="row mb-4">
            <div class="col-md-8">
                <h2>Welcome to PharmaCare Online Pharmacy</h2>
                <p class="text-muted">Browse our collection of quality medicines</p>
            </div>
            <div class="col-md-4">
                <form th:action="@{/medicines}" method="get" class="d-flex">
                    <input type="text" name="search" class="form-control search-box" placeholder="Search medicines...">
                    <button type="submit" class="btn btn-primary ms-2">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>
        </div>
        
        <div class="row mb-4">
            <div class="col-12">
                <div class="btn-group" role="group">
                    <a th:href="@{/home}" class="btn btn-outline-primary" 
                       th:classappend="${prescription == null ? 'active' : ''}">All</a>
                    <a th:href="@{/home(prescription=false)}" class="btn btn-outline-primary"
                       th:classappend="${prescription != null and !prescription ? 'active' : ''}">No Prescription</a>
                    <a th:href="@{/home(prescription=true)}" class="btn btn-outline-primary"
                       th:classappend="${prescription != null and prescription ? 'active' : ''}">Prescription Required</a>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-3 mb-4" th:each="medicine : ${medicines.content}">
                <div class="card medicine-card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${medicine.name}">Medicine Name</h5>
                        <p class="text-muted mb-1" th:text="${medicine.brand}">Brand</p>
                        <p class="text-muted mb-2">
                            <small th:text="${medicine.category.name}">Category</small>
                        </p>
                        <h4 class="text-primary mb-3">₹<span th:text="${medicine.price}">0.00</span></h4>
                        
                        <div class="mb-2">
                            <span class="badge badge-prescription" th:if="${medicine.prescriptionRequired}">
                                <i class="bi bi-file-medical"></i> Prescription Required
                            </span>
                            <span class="badge" 
                                  th:classappend="${medicine.stock > 10 ? 'badge-stock' : 'badge-low-stock'}"
                                  th:text="${medicine.stock > 0 ? 'In Stock' : 'Out of Stock'}">
                                In Stock
                            </span>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <div class="btn-group" role="group" th:if="${medicine.stock > 0}">
                                <form th:action="@{/cart/add}" method="post" style="flex: 1;">
                                    <input type="hidden" name="medicineId" th:value="${medicine.id}">
                                    <button type="submit" class="btn btn-primary btn-sm w-100">
                                        <i class="bi bi-cart-plus"></i> Add to Cart
                                    </button>
                                </form>
                                <form th:action="@{/wishlist/add}" method="post" style="flex: 1;" class="ms-1">
                                    <input type="hidden" name="medicineId" th:value="${medicine.id}">
                                    <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                        <i class="bi bi-heart"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <nav th:if="${totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/home(page=${currentPage - 1})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/home(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/home(page=${currentPage + 1})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
