<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    
    <div class="container my-5">
        <h2 class="mb-4">My Wishlist</h2>
        
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div th:if="${#lists.isEmpty(wishlistItems)}" class="text-center py-5">
            <i class="bi bi-heart" style="font-size: 5rem; color: #ccc;"></i>
            <h3 class="mt-3">Your wishlist is empty</h3>
            <p>Add medicines you love to keep track of them</p>
            <a th:href="@{/medicines}" class="btn btn-primary">Browse Medicines</a>
        </div>
        
        <div th:if="${!#lists.isEmpty(wishlistItems)}">
            <div class="row">
                <div class="col-md-12">
                    <div class="card mb-3" th:each="item : ${wishlistItems}">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col-md-6">
                                    <h5 th:text="${item.medicine.name}">Medicine Name</h5>
                                    <p class="text-muted mb-1" th:text="${item.medicine.brand}">Brand</p>
                                    <p class="text-primary mb-0">₹<span th:text="${#numbers.formatDecimal(item.medicine.price, 1, 2)}">0.00</span></p>
                                    <small class="text-muted">
                                        Added on <span th:text="${#temporals.format(item.createdAt, 'dd MMM yyyy')}">Date</span>
                                    </small>
                                </div>
                                <div class="col-md-3">
                                    <span class="badge" 
                                          th:classappend="${item.medicine.stock > 0 ? 'bg-success' : 'bg-danger'}">
                                        <span th:text="${item.medicine.stock > 0 ? 'In Stock' : 'Out of Stock'}">Stock</span>
                                    </span>
                                </div>
                                <div class="col-md-3 text-end">
                                    <form th:action="@{/wishlist/move-to-cart}" method="post" class="mb-2" 
                                          th:if="${item.medicine.stock > 0}">
                                        <input type="hidden" name="wishlistId" th:value="${item.id}">
                                        <button type="submit" class="btn btn-sm btn-primary w-100">
                                            <i class="bi bi-cart-plus"></i> Move to Cart
                                        </button>
                                    </form>
                                    <form th:action="@{/wishlist/remove}" method="post">
                                        <input type="hidden" name="wishlistId" th:value="${item.id}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                                            <i class="bi bi-trash"></i> Remove
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer th:replace="~{fragments/header :: footer}"></footer>
    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
